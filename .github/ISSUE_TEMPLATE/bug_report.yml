name: Bug Report
description: Report a reproducible issue in the current MVP runtime.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, database passwords,
        bearer tokens, private URLs, or production data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the exact commands, YAML, and input data needed to reproduce.
      placeholder: |
        1. Run `bin/kuaia ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Pipeline YAML
        - File source
        - Postgres source
        - Transform
        - File or console sink
        - Vector sink
        - Checkpoint or state store
        - Coordinator or worker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Java version, Maven version, and Docker version if relevant.
      placeholder: |
        OS:
        Java:
        Maven:
        Docker:
    validations:
      required: true
