name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run tests
        run: mvn -q test

      - name: Package runtime
        run: mvn -q package

      - name: Run public MVP smoke
        run: make public-mvp-smoke

      - name: Smoke test CLI help and Compose config
        run: |
          java -jar kuaia-engine/target/kuaia-engine-0.1.0-cli.jar help
          bin/kuaia help
          docker compose config
