syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.kuaia.common.raft";

enum CommandType {
  SAVE_TASK = 0;
  UPDATE_STATE = 1;
}

message RaftCommand {
  CommandType type = 1;
  oneof payload {
    SaveTaskPayload save_task = 2;
    UpdateStatePayload update_state = 3;
  }
}

message SaveTaskPayload {
  string task_id = 1;
  bytes definition = 2; // Serialized TaskDefinition
}

message UpdateStatePayload {
  string task_id = 1;
  int32 state_code = 2;
}
