services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kuaia
      POSTGRES_USER: kuaia
      POSTGRES_PASSWORD: kuaia
    ports:
      - "5432:5432"
    volumes:
      - ./examples/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
