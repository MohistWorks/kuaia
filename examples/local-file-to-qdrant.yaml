name: local-file-to-qdrant
source:
  type: file
  path: data/documents.csv
  format: csv
transforms:
  - type: select
    fields: [id, content]
  - type: mock-embedding
    input: content
    output: embedding
    dimensions: 4
sink:
  type: qdrant
  url: http://localhost:6333
  collection: kuaia_docs
  idField: id
  vectorField: embedding
  payloadFields: [id, content]
  wait: true
  timeoutMs: 30000
checkpoint:
  stateDir: .kuaia/state/local-file-to-qdrant
