name: local-jsonl-to-file
source:
  type: file
  path: data/documents.jsonl
  format: jsonl
transforms:
  - type: select
    fields: [id, content]
  - type: trim
    field: content
  - type: lowercase
    field: content
  - type: filter
    field: content
    op: not-empty
  - type: filter
    field: content
    op: min-length
    minLength: 4
  - type: filter
    field: content
    op: contains
    value: a
sink:
  type: file
  path: ../.kuaia/output/local-jsonl-to-file.jsonl
  format: jsonl
  mode: overwrite
