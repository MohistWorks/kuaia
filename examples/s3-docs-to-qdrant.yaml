name: s3-docs-to-qdrant
source:
  type: s3
  endpoint: http://localhost:9000
  region: us-east-1
  bucket: kuaia-docs
  prefix: docs/
  accessKeyEnv: KUAIA_S3_ACCESS_KEY
  secretKeyEnv: KUAIA_S3_SECRET_KEY
  pathStyleAccess: true
transforms:
  - type: mock-embedding
    input: content
    output: embedding
    dimensions: 4
    batchSize: 32
sink:
  type: qdrant
  url: http://localhost:6333
  collection: kuaia_s3_docs
  idField: id
  vectorField: embedding
  payloadFields: [id, key, content]
  wait: true
checkpoint:
  stateDir: .kuaia/state/s3-docs-to-qdrant
